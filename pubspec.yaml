name: go_translator
description: A new Flutter project.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.2.1
  flutter_tts: ^4.2.3
  google_mlkit_translation: ^0.13.0

  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  logger: ^2.6.2
  path: ^1.9.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.7
  avatar_glow: ^3.0.1
  speech_to_text: ^7.3.0
  flutter_launcher_icons: ^0.14.4
  share_plus: ^12.0.1
  fluttertoast: ^9.0.0
  package_info_plus: ^9.0.1
  # device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.7.1
  riverpod_generator: ^4.0.9
  # custom_lint: ^0.8.0
  # flutter_lints: ^6.0.0
  # import_sorter: ^4.6.0
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icons/app_icon.png"

dependency_overrides:

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    # Shown on the Open source licences page (registered in main.dart).
    - assets/fonts/Inter-LICENSE.txt

  # Inter 4.1 (SIL Open Font License, see assets/fonts/Inter-LICENSE.txt).
  # Bundled so the app needs no network for fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

import_sorter:
  comments: false
